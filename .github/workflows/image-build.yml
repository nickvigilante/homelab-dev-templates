name: image-build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - 'images/base/**'
              - '.github/workflows/image-build.yml'

  # PR-only: prove both platforms build and boot, natively (no QEMU — each
  # matrix leg runs on a runner matching its own platform) — no image is
  # pushed, so there's no multi-arch manifest to merge here.
  validate:
    name: validate (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: base:validate
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=base-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.platform }}
      - name: Smoke test — confirm the image boots
        run: docker run --rm base:validate uname -m
      - name: Verify baked-in CLI tools landed
        run: |
          docker run --rm base:validate sh -c \
            'rg --version && fd --version && eza --version && bat --version \
             && gh --version && delta --version && lazygit --version \
             && fzf --version && gum --version && nvim --version \
             && chezmoi --version && starship --version && just --version \
             && zoxide --version && uv --version && ruff --version'
      - name: Verify no dotfiles secrets leaked into the image (DOTFILES-AUDIT.md gate)
        run: |
          set -euo pipefail
          echo "== .kube/homelab.yaml (cluster-admin kubeconfig) must not exist =="
          if docker run --rm base:validate sh -c 'test -e "$HOME/.kube/homelab.yaml"'; then
            echo "::error::homelab.yaml kubeconfig leaked into the image!"
            exit 1
          fi
          echo "OK — absent."

          echo "== ~/.ssh must contain no private key material =="
          leaked_ssh="$(docker run --rm base:validate sh -c '
            [ -d "$HOME/.ssh" ] || exit 0
            for f in "$HOME"/.ssh/*; do
              [ -f "$f" ] || continue
              case "$(basename "$f")" in
                config|known_hosts*|authorized_keys|*.pub) continue ;;
              esac
              file "$f" | grep -qiE "private key|PEM|OpenSSH" && echo "$f"
            done
          ')"
          if [ -n "$leaked_ssh" ]; then
            echo "::error::SSH private key material found: $leaked_ssh"
            exit 1
          fi
          echo "OK — no SSH private key material."

          echo "== ~/.netrc must be empty or absent =="
          if docker run --rm base:validate sh -c 'test -s "$HOME/.netrc"'; then
            echo "::error::non-empty .netrc found!"
            exit 1
          fi
          echo "OK — no netrc content."

          echo "== no secret-looking environment variables =="
          leaked_env="$(docker run --rm base:validate sh -c 'env' | grep -i -E 'token|secret|password' || true)"
          if [ -n "$leaked_env" ]; then
            echo "::error::Secret-looking env vars found: $leaked_env"
            exit 1
          fi
          echo "OK — no secret-looking env vars."

  # main-only: build+push each platform by digest, then merge into one
  # multi-arch manifest. Two independent native builds (no QEMU), each
  # pushed under a temporary per-digest reference so buildx imagetools can
  # stitch them together without re-building anything.
  build:
    name: build (${{ matrix.platform }})
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      digest-amd64: ${{ steps.digest-out.outputs.amd64 }}
      digest-arm64: ${{ steps.digest-out.outputs.arm64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=ghcr.io/nickvigilante/homelab-dev-templates,push-by-digest=true,name-canonical=true,push=true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=base-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.platform }}
      - name: Export digest
        id: digest-out
        run: |
          arch="$(echo '${{ matrix.platform }}' | cut -d/ -f2)"
          echo "${arch}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  publish:
    name: publish (merge manifest)
    needs: [changes, build]
    if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push the multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/nickvigilante/homelab-dev-templates:${{ github.sha }} \
            -t ghcr.io/nickvigilante/homelab-dev-templates:latest \
            ghcr.io/nickvigilante/homelab-dev-templates@${{ needs.build.outputs.digest-amd64 }} \
            ghcr.io/nickvigilante/homelab-dev-templates@${{ needs.build.outputs.digest-arm64 }}
