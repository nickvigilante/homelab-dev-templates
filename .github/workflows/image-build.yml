name: image-build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - 'images/base/**'
              - '.github/workflows/image-build.yml'

  validate:
    name: validate (build only, both platforms)
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: false
          tags: base:pr-validate
          outputs: type=oci,dest=/tmp/base-image.tar
      - name: Smoke test — confirm the arm64 image actually boots
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 \
            --load -t base:arm64-smoke images/base
          docker run --rm --platform linux/arm64 base:arm64-smoke uname -m
      - name: Build amd64 image (loaded) for tool + secrets verification
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 \
            --load -t base:amd64-smoke images/base
      - name: Verify baked-in CLI tools landed
        run: |
          set -euo pipefail
          docker run --rm base:amd64-smoke sh -c '
            set -e
            rg --version
            fd --version
            starship --version
            bat --version
            eza --version
            chezmoi --version
            which chezmoi
          '
      - name: Verify no dotfiles secrets leaked into the image (DOTFILES-AUDIT.md gate)
        run: |
          set -euo pipefail
          echo "== .kube/homelab.yaml (cluster-admin kubeconfig) must not exist =="
          if docker run --rm base:amd64-smoke sh -c 'test -e "$HOME/.kube/homelab.yaml"'; then
            echo "::error::homelab.yaml kubeconfig leaked into the image!"
            exit 1
          fi
          echo "OK — absent."

          echo "== ~/.ssh must be empty or absent =="
          if docker run --rm base:amd64-smoke sh -c 'ls -A "$HOME/.ssh" 2>/dev/null | grep -q .'; then
            echo "::error::SSH key material found in ~/.ssh!"
            exit 1
          fi
          echo "OK — no SSH keys."

          echo "== ~/.netrc must be empty or absent =="
          if docker run --rm base:amd64-smoke sh -c 'test -s "$HOME/.netrc"'; then
            echo "::error::non-empty .netrc found!"
            exit 1
          fi
          echo "OK — no netrc content."

          echo "== no secret-looking environment variables =="
          leaked_env="$(docker run --rm base:amd64-smoke sh -c 'env' | grep -i -E 'token|secret|password' || true)"
          if [ -n "$leaked_env" ]; then
            echo "::error::Secret-looking env vars found: $leaked_env"
            exit 1
          fi
          echo "OK — no secret-looking env vars."

  publish:
    name: publish (main only)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nickvigilante/homelab-dev-templates:${{ github.sha }}
            ghcr.io/nickvigilante/homelab-dev-templates:latest
