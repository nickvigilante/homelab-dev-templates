name: template-validate

# PR-only, and deliberately on a GitHub-hosted runner.
#
# This is the trigger fork pull requests can reach, so it must never run on the
# self-hosted in-cluster runner: this repository is public, and a pull_request
# job executes the PR's own code. Delivery lives in template-push.yml, which is
# push-only for exactly that reason. See docs/runner-setup.md.
#
# This is a structural check only: it fails an affected template that has no
# template.json. There is deliberately no live validation against Coder here.
# That needed a CI node on the tailnet, and Tailnet Lock correctly refuses a
# node that no signing node has signed. A Tailscale credential in this public
# repository's secrets would be exactly the foothold the lock exists to close.
# Run the provisioner-side check from a machine that is already on the
# tailnet instead; see docs/runner-setup.md.
on:
  pull_request:
    branches: [main]
    paths:
      - 'templates/**'
      # Otherwise a change to this workflow alone never runs it.
      - '.github/workflows/template-validate.yml'
      - 'modules/workspace/**'
      - 'scripts/vendor-module.sh'
      - 'scripts/changed-templates.sh'
      - 'scripts/template-matrix.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which templates this PR affects. A module change affects all of them; see
  # scripts/changed-templates.sh.
  changes:
    runs-on: ubuntu-latest
    steps:
      # Full history: the diff needs the PR's base commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # template-matrix.sh fails on an affected template with no
      # template.json, so the gap shows on the pull request and not only when
      # template-push.yml runs on main.
      - name: List affected templates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          matrix="$(scripts/template-matrix.sh "$BASE_SHA" HEAD)"
          echo "Affected templates: $(printf '%s' "$matrix" | jq -c 'map(.template)')"
